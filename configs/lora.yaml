model:
  name: TinyLlama/TinyLlama-1.1B-Chat-v1.0

data:
  train_file: data/processed/qa_sft_train.jsonl
  val_file: data/processed/qa_sft_val.jsonl
  text_field: text
  max_train_samples: 0
  max_eval_samples: 0

adapter:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules: ["q_proj", "k_proj", "v_proj", "o_proj"]
  bias: none
  task_type: CAUSAL_LM

quantization:
  enabled: false

training:
  output_dir: outputs/lora/first_lora_qa_tinyllama
  num_train_epochs: 1
  learning_rate: 0.0002
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 8
  warmup_ratio: 0.03
  logging_steps: 5
  save_steps: 25
  eval_steps: 25
  evaluation_strategy: steps
  save_strategy: steps
  max_length: 768
  gradient_checkpointing: true
  fp16: true
  bf16: false
  report_to: []

runtime:
  seed: 42
